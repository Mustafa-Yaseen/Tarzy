<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eff6ff">
  <title>مقاسات العملاء</title>
  <style>
    :root {
      --bg: #eff6ff;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --primary: #1d4ed8;
      --primary-dark: #1e3a8a;
      --primary-soft: #dbeafe;
      --text: #0f172a;
      --muted: #64748b;
      --border: #dbeafe;
      --danger: #b91c1c;
      --danger-soft: #fee2e2;
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Tahoma, "Segoe UI", Arial, sans-serif;
      line-height: 1.6;
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar-inner {
      max-width: 760px;
      margin: auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 20px;
      font-weight: 800;
    }

    .brand h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .nav {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--text);
      border-radius: 11px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
    }

    .nav-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .container {
      max-width: 760px;
      margin: 20px auto;
      padding: 0 16px 40px;
    }

    .page { display: none; }
    .page.active { display: block; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: 0 6px 22px rgba(29, 78, 216, 0.06);
    }

    .card h2 {
      margin: 0 0 14px;
      font-size: 16px;
      color: var(--primary);
    }

    .fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field.full { grid-column: 1 / -1; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 5px;
    }

    input, textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 11px;
      background: var(--surface-soft);
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 72px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .btn {
      border: 0;
      border-radius: 11px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover { background: var(--primary-dark); }

    .btn-outline {
      background: #fff;
      color: var(--text);
      border: 1px solid #cbd5e1;
    }

    .btn-light {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .btn-danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .btn-small {
      padding: 6px 11px;
      font-size: 12px;
      border-radius: 9px;
    }

    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .customer-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .customer-card {
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 13px;
      background: var(--surface-soft);
    }

    .customer-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
    }

    .customer-name {
      font-weight: 800;
      font-size: 15px;
    }

    .customer-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .card-actions {
      display: flex;
      gap: 6px;
    }

    .measure-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-top: 10px;
    }

    .measure {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 6px 8px;
    }

    .measure span {
      display: block;
      font-size: 10px;
      color: var(--muted);
    }

    .measure strong {
      font-size: 13px;
      color: var(--primary-dark);
    }

    .notes {
      margin-top: 9px;
      font-size: 12px;
      color: #1e3a8a;
      background: var(--primary-soft);
      padding: 7px 10px;
      border-radius: 9px;
    }

    .empty {
      text-align: center;
      padding: 28px 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary-dark);
      color: #fff;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
      z-index: 50;
    }

    @media (max-width: 560px) {
      .fields { grid-template-columns: 1fr; }
      .measure-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">✂</div>
        <h1>مقاسات العملاء</h1>
      </div>
      <nav class="nav">
        <button type="button" class="nav-btn active" id="addPageBtn">إضافة زبون</button>
        <button type="button" class="nav-btn" id="searchPageBtn">البحث (<span id="totalBadge">0</span>)</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- صفحة 1: إضافة زبون وبياناته -->
    <section class="page active" id="addPage">
      <div class="card">
        <h2 id="formTitle">إضافة زبون جديد</h2>
        <form id="customerForm">
          <input type="hidden" id="editId">
          <div class="fields">
            <div class="field">
              <label for="name">اسم الزبون *</label>
              <input id="name" type="text" required placeholder="مثال: محمود أحمد">
            </div>
            <div class="field">
              <label for="phone">رقم الهاتف</label>
              <input id="phone" type="tel" placeholder="01xxxxxxxxx">
            </div>
            <div class="field">
              <label for="sleeveWidth">الكم (سم)</label>
              <input id="sleeveWidth" type="number" step="0.5" placeholder="22">
            </div>
            <div class="field">
              <label for="width">العرض (سم)</label>
              <input id="width" type="number" step="0.5" placeholder="46">
            </div>
            <div class="field">
              <label for="collar">قبة (سم)</label>
              <input id="collar" type="number" step="0.5" placeholder="40">
            </div>
            <div class="field">
              <label for="length">طول (سم)</label>
              <input id="length" type="number" step="0.5" placeholder="140">
            </div>
            <div class="field">
              <label for="sleeveLength">طول كم (سم)</label>
              <input id="sleeveLength" type="number" step="0.5" placeholder="60">
            </div>
            <div class="field">
              <label for="bodyWidth">عرض البدن (سم)</label>
              <input id="bodyWidth" type="number" step="0.5" placeholder="56">
            </div>
            <div class="field">
              <label for="hem">الديل (سم)</label>
              <input id="hem" type="number" step="0.5" placeholder="62">
            </div>
            <div class="field full">
              <label for="notes">ملاحظات</label>
              <textarea id="notes" placeholder="موديل / قماش / تسليم..."></textarea>
            </div>
          </div>
          <div class="actions">
            <button type="submit" class="btn btn-primary" id="saveBtn">حفظ</button>
            <button type="button" class="btn btn-outline" id="cancelBtn" hidden>إلغاء التعديل</button>
          </div>
        </form>
      </div>
    </section>

    <!-- صفحة 2: البحث -->
    <section class="page" id="searchPage">
      <div class="card">
        <h2>البحث عن زبون</h2>
        <div class="search-row">
          <input id="searchInput" type="search" placeholder="ابحث بالاسم أو رقم الهاتف...">
          <button type="button" class="btn btn-outline" id="clearSearchBtn">مسح</button>
        </div>

        <div class="customer-list" id="customersList"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = 'tailor_db_v1';
    const measurementFields = [
      ['sleeveWidth', 'الكم'],
      ['width', 'العرض'],
      ['collar', 'قبة'],
      ['length', 'طول'],
      ['sleeveLength', 'طول كم'],
      ['bodyWidth', 'عرض البدن'],
      ['hem', 'الديل']
    ];

    let customers = [];
    const $ = id => document.getElementById(id);

    function showToast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(window.__t);
      window.__t = setTimeout(() => { t.style.display = 'none'; }, 2000);
    }

    function showPage(page) {
      const isAdd = page === 'add';
      $('addPage').classList.toggle('active', isAdd);
      $('searchPage').classList.toggle('active', !isAdd);
      $('addPageBtn').classList.toggle('active', isAdd);
      $('searchPageBtn').classList.toggle('active', !isAdd);
      if (!isAdd) $('searchInput').focus();
    }

    $('addPageBtn').addEventListener('click', () => showPage('add'));
    $('searchPageBtn').addEventListener('click', () => showPage('search'));

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        customers = raw ? JSON.parse(raw) : [];
      } catch {
        customers = [];
      }
      render();
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(customers));
      render();
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }

    function resetForm() {
      $('customerForm').reset();
      $('editId').value = '';
      $('formTitle').textContent = 'إضافة زبون جديد';
      $('saveBtn').textContent = 'حفظ';
      $('cancelBtn').hidden = true;
    }

    function editCustomer(id) {
      const c = customers.find(item => String(item.id) === String(id));
      if (!c) return;
      $('editId').value = c.id;
      $('name').value = c.name || '';
      $('phone').value = c.phone || '';
      $('notes').value = c.notes || '';
      measurementFields.forEach(([key]) => {
        $(key).value = c[key] ?? '';
      });
      $('formTitle').textContent = 'تعديل بيانات الزبون';
      $('saveBtn').textContent = 'تحديث';
      $('cancelBtn').hidden = false;
      showPage('add');
    }

    function deleteCustomer(id) {
      if (!confirm('هل تريد حذف هذا الزبون؟')) return;
      customers = customers.filter(item => String(item.id) !== String(id));
      if ($('editId').value === String(id)) resetForm();
      saveData();
      showToast('تم الحذف');
    }

    function render() {
      const q = $('searchInput').value.trim().toLowerCase();
      const filtered = customers.filter(c =>
        String(c.name || '').toLowerCase().includes(q) ||
        String(c.phone || '').toLowerCase().includes(q)
      );

      $('totalBadge').textContent = customers.length;

      if (!filtered.length) {
        $('customersList').innerHTML = '<div class="empty">لا توجد سجلات مطابقة</div>';
        return;
      }

      $('customersList').innerHTML = filtered.map(c => {
        const measures = measurementFields
          .filter(([key]) => c[key] !== '' && c[key] != null)
          .map(([key, label]) => `<div class="measure"><span>${label}</span><strong>${escapeHtml(c[key])} سم</strong></div>`)
          .join('');

        return `
          <div class="customer-card">
            <div class="customer-top">
              <div>
                <div class="customer-name">${escapeHtml(c.name)}</div>
                <div class="customer-meta">${c.phone ? 'هاتف: ' + escapeHtml(c.phone) : 'بدون هاتف'} · ${escapeHtml(c.updatedAt || '')}</div>
              </div>
              <div class="card-actions">
                <button type="button" class="btn btn-light btn-small" onclick="editCustomer('${escapeHtml(c.id)}')">تعديل</button>
                <button type="button" class="btn btn-danger btn-small" onclick="deleteCustomer('${escapeHtml(c.id)}')">حذف</button>
              </div>
            </div>
            ${measures ? `<div class="measure-grid">${measures}</div>` : ''}
            ${c.notes ? `<div class="notes">${escapeHtml(c.notes)}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    $('customerForm').addEventListener('submit', e => {
      e.preventDefault();
      const name = $('name').value.trim();
      if (!name) return;

      const id = $('editId').value || String(Date.now());
      const record = {
        id,
        name,
        phone: $('phone').value.trim(),
        notes: $('notes').value.trim(),
        updatedAt: new Date().toLocaleDateString('ar-EG')
      };
      measurementFields.forEach(([key]) => {
        record[key] = $(key).value;
      });

      const idx = customers.findIndex(c => String(c.id) === String(id));
      if (idx >= 0) {
        customers[idx] = record;
        showToast('تم التحديث');
      } else {
        customers.unshift(record);
        showToast('تم الحفظ');
      }

      resetForm();
      saveData();
    });

    $('cancelBtn').addEventListener('click', resetForm);
    $('searchInput').addEventListener('input', render);
    $('clearSearchBtn').addEventListener('click', () => {
      $('searchInput').value = '';
      render();
    });

    loadData();
  </script>
</body>
</html>
